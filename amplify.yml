version: 1
applications:
  - appRoot: web-client
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - echo "VITE_API_URL=https://51.20.85.74.sslip.io" >> .env
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
    customRules:
      - source: /<*>
        target: /index.html
        status: "404-200"
